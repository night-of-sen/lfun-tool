  <h1 class="hero-title">🔄 图片格式转换</h1>
  <p class="hero-sub">在浏览器里转 WebP / JPEG / PNG，可同时缩放。</p>
  <div class="app" data-app="image-convert">
    <input type="file" id="icv-file" accept="image/*" multiple class="app-file">
    <div class="app-row">
      <label>输出格式
        <select id="icv-type" class="sort" style="width:auto">
          <option value="image/webp">WebP</option><option value="image/jpeg">JPEG</option><option value="image/png">PNG</option>
        </select>
      </label>
      <label>质量 <input type="range" id="icv-q" min="0.3" max="1" step="0.05" value="0.9"><span id="icv-qv">0.90</span></label>
      <label>最大宽度 <input type="number" id="icv-w" value="0" min="0" style="width:5.5em"> px（0 = 不缩放）</label>
    </div>
    <div id="icv-out" class="app-list"></div>
  </div>
  <p class="privacy-note">🔒 全部在浏览器本地运行，文件和内容不会上传到任何服务器。</p>
  <section class="prose"><h2>关于这个工具</h2><p>转 WebP 通常能把图片压到原体积的一半以下，而且现代浏览器全都支持——它是提升页面加载速度最省事的一招。转换在本地完成，图片不会上传。</p></section>
