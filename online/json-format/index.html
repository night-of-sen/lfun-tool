  <h1 class="hero-title">🧩 JSON 格式化</h1>
  <p class="hero-sub">格式化、压缩、校验 JSON，支持语法错误定位。数据不上传。</p>
  <div class="app" data-app="json-format">
    <div class="app-row">
      <label for="jf-indent">缩进</label>
      <select id="jf-indent"><option value="2">2 空格</option><option value="4">4 空格</option><option value="tab">Tab</option></select>
      <button class="app-btn" data-act="format">格式化</button>
      <button class="app-btn" data-act="minify">压缩</button>
      <button class="app-btn" data-act="validate">校验</button>
      <button class="app-btn ghost" data-act="clear">清空</button>
    </div>
    <textarea id="jf-in" class="app-area" rows="10" placeholder='粘贴 JSON，例如 {"a":1,"b":[2,3]}'></textarea>
    <div id="jf-msg" class="app-msg"></div>
    <textarea id="jf-out" class="app-area" rows="10" readonly placeholder="结果会出现在这里"></textarea>
    <div class="app-row"><button class="app-btn" data-copy="jf-out">复制结果</button></div>
  </div>
  <p class="privacy-note">🔒 全部在浏览器本地运行，文件和内容不会上传到任何服务器。</p>
  <section class="prose"><h2>关于这个工具</h2><p>粘贴 JSON 就能立即格式化。出错时会给出具体的位置和原因，比在编辑器里翻找快得多。所有解析都在浏览器里完成，不会上传任何内容。</p></section>
