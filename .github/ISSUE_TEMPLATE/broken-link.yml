name: 报告链接失效或信息有误
description: 链接打不开、描述过时、分类不对
title: "[问题] "
labels: ["bug"]
body:
  - type: input
    id: tool
    attributes:
      label: 哪个工具
      description: 工具名或页面地址
      placeholder: https://tools.lfun.cloud/tool/excalidraw/
    validations:
      required: true

  - type: dropdown
    id: kind
    attributes:
      label: 问题类型
      options:
        - 官网链接打不开
        - GitHub 仓库不存在
        - 描述或分类不对
        - 页面显示异常
        - 其他
    validations:
      required: true

  - type: textarea
    id: detail
    attributes:
      label: 具体情况
      description: 如果有报错信息或截图，一并贴上来
    validations:
      required: true
